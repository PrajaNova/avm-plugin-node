[package]
name = "avm-plugin-node"
version = "0.2.8"
edition = "2021"
description = "avm native provider for Node.js — versions, install, package.json scripts. Speaks avm's plugin protocol (https://github.com/PrajaNova/avm)."
license = "MIT"
repository = "https://github.com/PrajaNova/avm-plugin-node"

[dependencies]
avm-plugin-api = { git = "https://github.com/PrajaNova/avm", branch = "feat/plugin-protocol-native-providers", package = "avm-plugin-api" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wait-timeout = "0.2"
